name: Native templates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - run: cargo test --locked --manifest-path templates/engine/native/Cargo.toml
